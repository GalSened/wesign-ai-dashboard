name: Build & Deploy AI Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'orchestrator/**'
      - 'frontend/**'
      - 'wesignv3-wesign-mcp-server/src/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
  workflow_dispatch:

env:
  SERVER: alex@192.168.21.5
  IMAGE: wesign-ai-dashboard
  PORT: 9000

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install httpx
      - name: Run API tests
        run: python tests/api/test_full_system.py
        continue-on-error: true  # Tests need live server

  build-deploy:
    needs: test
    runs-on: [self-hosted, linux]  # alex-ai server
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          cd ${{ github.workspace }}
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} .
          docker tag ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:latest

      - name: Deploy
        run: |
          docker rm -f ${{ env.IMAGE }} || true
          docker run -d \
            --name ${{ env.IMAGE }} \
            -p ${{ env.PORT }}:8000 \
            --env-file ~/.wesign-ai.env \
            --memory=2g --cpus=2 \
            -v wesign-ai-data:/tmp \
            --add-host=host.docker.internal:host-gateway \
            --restart unless-stopped \
            ${{ env.IMAGE }}:latest

      - name: Health check
        run: |
          sleep 20
          curl -sf http://localhost:${{ env.PORT }}/health || exit 1
          echo "Deployment healthy"
